{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <section class="container-fluid">
        <div class="row">
            <!-- Actual Nav Bar -->
            <nav class="navbar navbar-expand-lg navbar-dark custom-navbar w-100 p-3" id="line">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                        </li>
                        <li class="nav-item">
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
    </section>

    <div class="d-flex flex-column justify-content-center align-items-center">
        <div class="card d-flex flex-column justify-content-center" style="width: 30rem; height: 40rem">
            <h5 class="card-title mx-3 mt-5 mb-1">SIGN IN</h5>
            <hr>
            <div class="card-body d-flex flex-column align-items-center">
                
                <form method="POST" action="{% url 'login.index' %}">
                    {% csrf_token %}
                    
                    
                    <input
                        type="text"
                        class="form-control"
                        name="username"  
                        id="email"
                        required
                        placeholder="Username"
                    />

                    {% for error in error_profile.username.errors %}
                        <div class="alert alert-danger mt-1">{{ error }}</div>
                    {% endfor %}

                    <br>

                    
                    <input
                        type="password"
                        class="form-control"
                        name="password"  
                        id="password"   
                        required
                        placeholder="Password"
                    />
                    
                    {% for error in error_profile.password.errors %}
                        <div class="alert alert-danger mt-1">{{ error }}</div>
                    {% endfor %}

                    <br>

                    
                    <button type="submit" id="signIn">Sign in</button>
                </form>

            </div>
        </div>
    </div>
{% endblock %}

<style>
    body{
        background-color: #7F5739;
    }

    #signIn{
        background-color: #7F5739;
        width: 400px;
        margin: 0 auto;  
        height: 50px;
        border-radius: 5px;
        color: white;
    }

    .card{
        border-radius: 20px;
    }

    #username, #password{
        width: 400px;
        border-color: black;
        height: 50px;
    }

    h5.card-title{
        font-size: 25px;
        color: #7F5739 !important;
    }
</style>
