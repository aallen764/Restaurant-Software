{% extends 'base.html' %}

{% block content %}
<div class="container-fluid p-0 mt-0 mb-5 pb-5"> 
    <div class="row no-gutters" style="min-height: 100vh;">
      <div class="col-7 d-flex justify-content-center"> 
        <div class="p-3 pt-0 w-75">

            <h1 class="display-6 mt-4 justify-content-center d-flex">Search Results Near You</h1>

            <!-- Row for cards -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-2 g-4">
                {% for business in businesses %}
                <!-- Dynamic Card for each business -->
                <div class="col">
                    <div class="card w-100">
                        <img src="{{ business.image_url }}" class="card-img-top" alt="card image" style="width: 100%; height: auto; max-height: 125px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title">{{ business.name }}</h5>
                            <p class="card-text text-secondary">{{ business.location.address1 }}</p>
                            <p class="card-text text-secondary">Rating: {{ business.rating }} / 5</p>
                            <a href="{% url 'map.index' %}" class="btn btn-primary" target="_blank">View on Map</a>
                        </div>
                    </div>
                </div>
                {% empty %}
                    <p>No results found.</p>
                {% endfor %}
            </div>
        </div>
      </div>

      <!-- Image on the right side -->
      <div class="col-5 p-0 d-flex flex-column">
        <div class="p-0 m-0 flex-grow-1">
          <img src="/static/images/searchImage.jpg" alt="search image" class="img-fluid w-100 h-100 object-fit-cover mt-5" style="z-index: 1 !important;"> 
        </div>
      </div>
    </div>
</div>
{% endblock content %}
