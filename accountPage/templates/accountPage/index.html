{% extends 'base.html' %}

{% block content %}

<div class="m-3 mb-0 pb-0">
    <div class="d-flex align-items-center">
        <i class="bi bi-person-circle brown" style="font-size: 10rem;"></i>
        <span style="font-size: 3rem; margin-left: 10px;" class="display-4">Welcome, {{ user.username }}</span>
    </div>
</div>

<div class="display-5 mb-5 pb-5" style="font-size: 2rem; padding-left: 190px;">
    <p>Username: {{ user.username }}</p>
    <p>Zipcode: {{ user.user_profile.zip_code }}</p>
    <p>Email: {{ user.user_profile.email_address }}</p>
    <p>Phone Number: {{ user.user_profile.phone_number }}</p>
</div>
<div class="d-flex w-100 justify-content-center mb-3">
    <a href="{% url 'account.index2' %}" class="btn btn-primary w-10">Change Account Information</a>
</div>

{% endblock content %}
