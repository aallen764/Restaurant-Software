{% extends 'base.html' %}

{% block content %}

<div class="m-3 mb-0 pb-0">
    <div class="d-flex align-items-center">
        <i class="bi bi-person-circle brown" style="font-size: 10rem;"></i>
        <span style="font-size: 3rem; margin-left: 10px;" class="display-4">Welcome, {{ user.username }}</span>
    </div>
</div>

<div class="display-5 mb-5 pb-5" style="font-size: 2rem; padding-left: 190px;">
    <p>Username: {{ user.username }}</p>
    <p>Zipcode: {{ user.user_profile.zip_code }}</p>
    <p>Email: {{ user.user_profile.email_address }}</p>
    <p>Phone Number: {{ user.user_profile.phone_number }}</p>
</div>

<div class="d-flex w-100 justify-content-center mb-3">
    <button class="btn btn-primary w-10" onclick="toggleForm()">Change Account Information</button>
</div>

<!-- Hidden form -->
<div id="editForm" style="display: none; padding-left: 190px;">
    <form method="POST" action="{% url 'account.update' %}">
        {% csrf_token %}
        <div class="form-group mb-2">
            <label for="username">Username:</label>
            <input type="text" class="form-control w-25" id="username" name="username" value="{{ user.username }}">
        </div>
        <div class="form-group mb-2">
            <label for="zip_code">Zipcode:</label>
            <input type="text" class="form-control w-25" id="zip_code" name="zip_code" value="{{ user.user_profile.zip_code }}">
        </div>
        <div class="form-group mb-2">
            <label for="email_address">Email:</label>
            <input type="email" class="form-control w-25" id="email_address" name="email_address" value="{{ user.user_profile.email_address }}">
        </div>
        <div class="form-group mb-3">
            <label for="phone_number">Phone Number:</label>
            <input type="text" class="form-control w-25" id="phone_number" name="phone_number" value="{{ user.user_profile.phone_number }}">
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
    </form>
</div>

<script>
    function toggleForm() {
        const form = document.getElementById('editForm');
        form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }
</script>

{% endblock content %}
